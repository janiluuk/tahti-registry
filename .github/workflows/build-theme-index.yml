name: Build Theme Index

on:
  push:
    branches:
      - master
    paths:
      - 'themes/**'

jobs:
  build-theme-index:
    name: Regenerate themes.json
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme index
        run: pnpm build-theme-index

      - name: Commit if changed
        run: |
          git diff --quiet themes.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add themes.json
          git commit -m "Regenerate themes.json"
          git push
